          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            fffff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/194_demo_world_tracking_live_reservation.sql ;;
            ttttt) echo "Live Demo Tracking reservation already present in disposable clone" ;;
            *) echo "Partial live Demo Tracking reservation in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = ttttt

      - name: Install inert demo provider profile scenario on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regclass('public.demo_world_profile_control') is not null,
            to_regclass('public.demo_world_profile_target') is not null,
            to_regclass('public.demo_world_profile_jobs') is not null,
            to_regclass('public.demo_world_profile_receipts') is not null,
            to_regprocedure('public.demo_world_profile_target_guard()') is not null,
            to_regprocedure('public.demo_world_claim_profile(uuid)') is not null,
            to_regprocedure('public.demo_world_execute_profile(bigint,uuid)') is not null,
            to_regprocedure('public.demo_world_profile_status()') is not null,
            exists(select 1 from pg_trigger where tgname='demo_world_profile_target_guard' and not tgisinternal),
            exists(select 1 from pg_trigger where tgname='demo_world_profile_receipt_immutable' and not tgisinternal))"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            ffffffffff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/195_demo_world_provider_profile.sql ;;
            tttttttttt) echo "Demo provider profile scenario already present in disposable clone" ;;
            *) echo "Partial demo provider profile migration state in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = tttttttttt

      - name: Install inert broker staff permission scenario on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regclass('public.demo_world_team_control') is not null,
            to_regclass('public.demo_world_team_target') is not null,
            to_regclass('public.demo_world_team_jobs') is not null,
            to_regclass('public.demo_world_team_receipts') is not null,
            to_regprocedure('public.demo_world_claim_team(uuid)') is not null,
            to_regprocedure('public.demo_world_execute_team(bigint,uuid)') is not null,
            to_regprocedure('public.demo_world_team_status()') is not null)"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            fffffff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/196_demo_world_broker_staff_permission.sql ;;
            ttttttt) echo "Demo broker staff permission scenario already present in disposable clone" ;;
            *) echo "Partial broker staff permission migration state in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = ttttttt

      - name: Install versioned demo provider profile copy on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            exists(select 1 from information_schema.columns
              where table_schema='public' and table_name='demo_world_profile_jobs'
                and column_name='copy_version'),
            to_regprocedure('public.demo_world_profile_copy(integer,boolean)') is not null,
            exists(select 1 from public.demo_world_profile_control
              where id=1 and manifest_version=2 and not enabled))"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            fff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/197_demo_world_provider_profile_copy_v2.sql ;;
            ttt) echo "Versioned demo provider profile copy already present in disposable clone" ;;
            *) echo "Partial demo provider profile copy migration state in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = ttt

      - name: Install inert vehicle duty cycle on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
