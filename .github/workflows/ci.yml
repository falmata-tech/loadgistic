          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = tttttt

      - name: Verify inert vehicle duty cycle on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-world-duty-cycle.sql

      - name: Verify durable Capacity and Tracking notification isolation on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          for suite in demo-world-durable-capacity demo-world-tracking-notification-sink; do
            timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
          done

      - name: Verify GPS privacy and credential races on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 7m node scripts/verify-telematics-privacy-concurrency-local.mjs

      - name: Install isolated GPS demo fixtures
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-ci-isolated-setup.sql

      - name: Verify exact fictional GPS cohort and provisioning authority
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          for suite in demo-gps-cohort-provision demo-gps-cohort; do
            timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
          done

      - name: Verify hosted motion kill switch and takeover on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/hosted-demo-motion-control.sql

      - name: Verify broker sharing scenario and private feed on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-world-business-sharing.sql

      - name: Verify inert provider profile cycle on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-world-provider-profile.sql

      - name: Verify inert broker staff permission cycle on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-world-broker-staff-permission.sql

      - name: Verify disarmed Tracking reservation and notification isolation
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          for suite in demo-world-tracking-lifecycle-readiness demo-world-tracking-lifecycle-reservation demo-tracking-exact-incomplete-resume demo-world-tracking-live-reservation; do
            timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
          done

      - name: Verify exact Admin demo GPS provenance on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-gps-admin-spare-provenance.sql

      - name: Verify GPS demo location arbitration
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          { printf "set loadgistic.demo_isolated_test = 'true';\n"; cat tests/sql/demo-location-arbitration.sql; } | timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1

      - name: Verify exact demo handover and durable worker on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          for suite in demo-world-atomic-handover demo-world-handover-worker; do
            timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
          done

      - name: Verify ordered phone and GPS locks
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m node scripts/verify-driver-capacity-phone-lock-order-local.mjs ordered

      - name: Remove disposable GPS test database
        if: always()
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: node scripts/ci-disposable-gps-database.mjs remove

      - name: Verify exact Featured migration bootstrap with rolled-back fixtures
        run: node scripts/verify-featured-bootstrap-local.mjs

      - name: Verify the Data API guard through SQL, REST and GraphQL
        run: node scripts/verify-data-api-guard.mjs

      - name: Audit high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Verify Driver linkage and optional documents without retaining test writes
        run: docker exec -i supabase_db_loadgistic-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/capacity-driver-eligibility.sql

      - name: Verify plan-free access and automatic Featured with rollback
        run: docker exec -i supabase_db_loadgistic-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/platform-controls.sql

      - name: Verify audit authorization and privacy regressions with rollback
        run: |
          for suite in worldwide-capacity-loads capacity-sharing-policy tracking-owner-handover tracking-owner-retention tracking-device-location capacity-launch-matching \
            independent-single-truck provider-owner-fleets provider-vehicle-authority provider-live-publication-limit provider-publication-owner-scope provider-authority-recovery provider-authority-command-denials provider-authority-search-path provider-authority-erasure provider-driving-intent provider-fleet-erasure provider-billing-retired capacity-search-metadata-cost capacity-multiple-options telematics telematics-account-privacy security-boundaries browser-boundaries account-details account-security capacity-viewport driver-portraits featured-random-rounds featured-continuous-rounds tracking-route-map \
            fleet-driver-onboarding driver-location-bootstrap driver-preverification dashboard-activity admin-service-geometry lifecycle-recovery public-provider-paging \
            public-provider-privacy support-attachments support-history support-polling chat-read-receipts driver-handover-alerts private-capacity-contact-names native-push-outbox tracking-proof-access tracking-email-session truck-document-alternatives capacity-ranked-search profile-search-page-cost public-provider-map-page-cost public-map-assigned-driver-cost personal-fleet-capacity-sharing featured-operation-status featured-team-permission featured-broadcast-window featured-tiktok-broadcast-state provider-only-support freight-vehicle-catalogue \
            account-deletion public-content-safety content-policy-acceptance app-review-accounts play-scope-safeguards play-review-business-isolation public-capacity-policy-scope \
            truck-regular-service-scope personal-public-identity staff-active-permission-preservation review-moderation-restrictions support-waiting-claim-eligibility \
            platform-brokerage-retirement customer-business-workspaces business-capacity-sharing tracking-owner-delegation location-radius-choices tracking-selected-sources \
            phone-location-installations business-support-alerts business-native-push provider-public-account-identity business-directory-verification business-directory-retention capacity-published-location-source-filter driver-manual-capacity-location; do
            echo "::group::SQL regression: $suite"
            docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
            echo "::endgroup::"
          done

      - name: Verify retired Guest workload twice with rollback
        run: node scripts/verify-retired-guest-workload-local.mjs

      - name: Prove authority recovery cannot restore unsafe publication rules
        run: node scripts/verify-provider-authority-rollback-local.mjs

      - name: Verify provider truck publication and assignment races
        run: node scripts/verify-independent-truck-concurrency-local.mjs

      - name: Verify queued authorization and account closure races
        run: node scripts/verify-audit-concurrency.mjs

      - name: Run domain and managed-contract tests
        run: npm test

      - name: Exercise the rolled-back 5,000-truck PostgreSQL scale fixture
        env:
          MARKET_SCALE_TRUCKS: 5000
        run: npm run test:scale

      - name: Type-check application
        run: npm run typecheck

      - name: Build production artifact
        run: npm run build

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-shards:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Every shard owns its database and retains one Playwright worker.
    timeout-minutes: 60
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: node scripts/ci-start-local-supabase.mjs

      - name: Apply provider-owned PostGIS containment on isolated local services
        run: node scripts/prepare-local-security.mjs

      - name: Reject unsafe public RLS, browser relation grants and definer RPCs
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql

      - name: Import and verify managed fixtures
        env:
          LOADGISTIC_DEMO_SHARED_EMAILS: ci-capacity@example.test
        run: npm run supabase:local:configure

      - name: Verify the Data API guard through SQL, REST and GraphQL
        run: node scripts/verify-data-api-guard.mjs

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Check browser fixture contract before long workflows
        run: node scripts/ci-fixture-preflight.mjs

      - name: Install locked Expo preview dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Start the isolated Loadgistic Expo preview for staff mobile-denial workflows
        working-directory: apps/mobile
        run: |
          mkdir -p ../../.local
          npm run preview:web > ../../.local/ci-mobile-preview.log 2>&1 &
          echo "$!" > ../../.local/ci-mobile-preview.pid

      - name: Run desktop and mobile browser workflows
        run: node scripts/ci-browser-shard.mjs '${{ matrix.shard }}'

      - name: Stop the task-owned Expo preview
        if: always()
        run: |
          if test -f .local/ci-mobile-preview.pid; then
            kill "$(cat .local/ci-mobile-preview.pid)" 2>/dev/null || true
          fi

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  featured-prepare:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        featured_case: [platform-controls, featured-operations-review, featured-team-permission]
    # Prepare persists rotation history. Each case has its own database, and
    # desktop/phone runs stay sequential inside that case's runner.
    timeout-minutes: 60
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: node scripts/ci-start-local-supabase.mjs

      - name: Apply provider-owned PostGIS containment on isolated local services
        run: node scripts/prepare-local-security.mjs

      - name: Reject unsafe public RLS, browser relation grants and definer RPCs
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql

      - name: Import and verify managed fixtures
        env:
          LOADGISTIC_DEMO_SHARED_EMAILS: ci-capacity@example.test
        run: npm run supabase:local:configure

      - name: Verify the Data API guard through SQL, REST and GraphQL
        run: node scripts/verify-data-api-guard.mjs

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Check browser fixture contract before Featured workflows
        run: node scripts/ci-fixture-preflight.mjs

      - name: Run isolated Featured Prepare workflow on desktop and phone
        run: node scripts/ci-featured-prepare.mjs '${{ matrix.featured_case }}'

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    needs: [e2e-shards, featured-prepare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard and isolated Featured workflow to pass
        run: |
          test '${{ needs.e2e-shards.result }}' = 'success'
          test '${{ needs.featured-prepare.result }}' = 'success'

  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add non-secret build-context canaries
        run: |
          mkdir -p .local .netlify supabase/.temp supabase/.branches
          touch .local/context-canary .netlify/context-canary supabase/.temp/context-canary supabase/.branches/context-canary

      - name: Build standalone container
        run: docker build --tag loadgistic:${{ github.sha }} .

  release-ready:
    needs: [validate, e2e, featured-prepare, mobile-internal, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-commit release boundary to pass
        run: |
          set -euo pipefail
          test '${{ needs.validate.result }}' = 'success'
          test '${{ needs.e2e.result }}' = 'success'
          test '${{ needs.featured-prepare.result }}' = 'success'
          test '${{ needs.mobile-internal.result }}' = 'success'
          test '${{ needs.container.result }}' = 'success'
