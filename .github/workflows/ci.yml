name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-internal:
    name: Mobile internal-build boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: true
      EXPO_PUBLIC_API_URL: https://loadgistic.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up mobile Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked dependencies for shared pure contracts
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Install locked mobile dependencies and checked decoder adapter
        run: npm ci
      - name: Check native types, lint, permissions and state invariants
        run: npm run typecheck && npm run lint && npm test
      - name: Reject missing fixed-copy translations
        run: node --experimental-strip-types scripts/audit-translations.mjs --strict
      - name: Export actual Android runtime
        run: npx expo export --platform android --source-maps --output-dir dist
      - name: Retain raw dependency audit status
        run: |
          MOBILE_AUDIT_EXIT=0
          npm audit --json > audit-report.json || MOBILE_AUDIT_EXIT=$?
          printf '%s\n' "$MOBILE_AUDIT_EXIT" > audit-exit-status.txt
      - name: Reject unreviewed findings or affected packages in Android runtime
        run: |
          MOBILE_MAP_PATH=$(find dist/_expo/static/js/android -name '*.map' -type f -print -quit)
          test -n "$MOBILE_MAP_PATH"
          node scripts/review-runtime-dependencies.mjs --audit audit-report.json --map "$MOBILE_MAP_PATH" > dependency-review.json
          cat dependency-review.json
      - name: Retain mobile audit and disposition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-dependency-evidence
          retention-days: 14
          path: |
            apps/mobile/audit-report.json
            apps/mobile/audit-exit-status.txt
            apps/mobile/dependency-review.json

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install checksum-pinned workflow linter
        run: npm run tools:workflow:setup

      - name: Validate specifications, source and delivery tooling before Docker
        run: npm run check

      - name: Require private demo GPS worker loopback roundtrip
        env:
          REQUIRE_GT06_LOOPBACK: 'true'
        run: timeout --signal=TERM --kill-after=10s 3m node --test tests/telematics-hosted-motion-worker.test.mjs tests/telematics-hosted-topology.test.mjs

      - name: Verify default-off hosted motion container packaging
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3m docker build -q -f infra/telematics/Dockerfile.motion -t loadgistic-hosted-motion:ci .
          timeout --signal=TERM --kill-after=10s 30s docker run --rm --network none loadgistic-hosted-motion:ci node /app/infra/telematics/hosted-motion-worker.mjs --preflight |
            node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.event!=='hosted_motion_preflight'||x.enabled!==false||x.deploymentAuthorized!==false)process.exit(1)})"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: node scripts/ci-start-local-supabase.mjs

      - name: Apply provider-owned PostGIS containment on isolated local services
        run: node scripts/prepare-local-security.mjs

      - name: Reject unsafe public RLS, browser relation grants and definer RPCs
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql

      - name: Prove the security gate rejects reintroduced browser grants
        run: node scripts/verify-database-security-gate.mjs

      - name: Import and verify managed fixtures
        env:
          LOADGISTIC_DEMO_SHARED_EMAILS: ci-capacity@example.test
        run: npm run supabase:local:configure

      - name: Install server-matched PostgreSQL host client for disposable GPS clone
        run: |
          set -euo pipefail
          . /etc/os-release
          test -n "${VERSION_CODENAME:-}"
          test "$(docker inspect --format '{{ index .Config.Labels "com.supabase.cli.project" }}' supabase_db_loadgistic-local)" = loadgistic-local
          local_pg_major="$(docker exec supabase_db_loadgistic-local psql -X -U postgres -d postgres -Atqc "select current_setting('server_version_num')::integer / 10000")"
          case "$local_pg_major" in 15|17) ;; *) exit 1 ;; esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$local_pg_major"
          test -x "/usr/lib/postgresql/$local_pg_major/bin/pg_dump"
          printf '/usr/lib/postgresql/%s/bin\n' "$local_pg_major" >> "$GITHUB_PATH"

      - name: Create disposable GPS test database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: node scripts/ci-disposable-gps-database.mjs create

      - name: Install and verify demo-world migrations on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regclass('public.demo_world_control') is not null,
            to_regprocedure('public.demo_world_claim_batch(uuid,integer)') is not null,
            to_regclass('public.demo_world_tracking_notification_sink') is not null,
            to_regprocedure('public.demo_world_tracking_fixture_isolated(uuid)') is not null,
            to_regclass('public.demo_world_handover_receipts') is not null,
            to_regprocedure('public.demo_world_execute_atomic_handover()') is not null,
            to_regclass('public.demo_world_handover_jobs') is not null,
            to_regprocedure('public.demo_world_claim_handover(uuid)') is not null)"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            ffffffff)
              for migration in 185_demo_world_durable_capacity 186_demo_world_tracking_notification_sink 187_demo_world_atomic_handover 188_demo_world_handover_worker; do
                timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < "supabase/migrations/$migration.sql"
              done
              ;;
            tttttttt) echo "Demo-world migrations already present in disposable clone" ;;
            *) echo "Partial demo-world migration state in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = tttttttt

      - name: Install default-off hosted demo motion guard on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regclass('public.demo_hosted_motion_control') is not null,
            to_regprocedure('public.hosted_demo_motion_command(uuid,uuid,jsonb)') is not null)"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            ff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/189_hosted_demo_motion_control.sql ;;
            tt) echo "Hosted demo motion guard already present in disposable clone" ;;
            *) echo "Partial hosted demo motion guard in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = tt

      - name: Install inert demo broker sharing scenario on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regclass('public.demo_world_business_share_control') is not null,
            to_regprocedure('public.demo_world_claim_business_share(uuid)') is not null,
            to_regprocedure('public.demo_world_execute_business_share(bigint,uuid)') is not null)"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            fff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/190_demo_world_business_capacity_sharing.sql ;;
            ttt) echo "Demo broker sharing scenario already present in disposable clone" ;;
            *) echo "Partial demo broker sharing scenario in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = ttt

      - name: Install disarmed demo Tracking reservation on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regclass('public.demo_world_tracking_lifecycle_control') is not null,
            to_regprocedure('public.demo_world_tracking_lifecycle_scope()') is not null,
            to_regprocedure('public.demo_world_tracking_lifecycle_email_sink()') is not null,
            to_regprocedure('public.demo_world_tracking_lifecycle_otp_sink()') is not null,
            to_regprocedure('public.demo_world_tracking_lifecycle_push_sink()') is not null)"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            fffff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/191_demo_world_tracking_lifecycle_reservation.sql ;;
            ttttt) echo "Demo Tracking reservation already present in disposable clone" ;;
            *) echo "Partial demo Tracking reservation in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = ttttt

      - name: Install exact Admin demo GPS provenance on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
            to_regprocedure('public.mark_demo_admin_spare_gps_fix()') is not null,
            exists(select 1 from pg_trigger where tgname='mark_demo_admin_spare_gps_fix' and not tgisinternal))"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            ff) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/192_demo_admin_spare_gps_provenance.sql ;;
            tt) echo "Exact Admin demo GPS provenance already present in disposable clone" ;;
            *) echo "Partial Admin demo GPS provenance in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = tt

      - name: Install exact incomplete Demo Tracking resume guard on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select position('target_exists := found' in
            pg_get_functiondef('public.demo_world_tracking_lifecycle_control_guard()'::regprocedure)) > 0"
          presence="$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")"
          case "$presence" in
            f) timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -q -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < supabase/migrations/193_demo_tracking_exact_incomplete_resume.sql ;;
            t) echo "Exact incomplete Demo Tracking resume guard already present in disposable clone" ;;
            *) echo "Demo Tracking resume guard missing or ambiguous in disposable clone" >&2; exit 1 ;;
          esac
          test "$(docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -Atqc "$presence_query")" = t

      - name: Install disarmed live Demo Tracking reservation on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          presence_query="select concat(
