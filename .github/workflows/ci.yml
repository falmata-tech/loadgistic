name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-internal:
    name: Mobile internal-build boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: true
      EXPO_PUBLIC_API_URL: https://loadgistic.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up mobile Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked dependencies for shared pure contracts
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Install locked mobile dependencies and checked decoder adapter
        run: npm ci
      - name: Check native types, lint, permissions and state invariants
        run: npm run typecheck && npm run lint && npm test
      - name: Reject missing fixed-copy translations
        run: node --experimental-strip-types scripts/audit-translations.mjs --strict
      - name: Export actual Android runtime
        run: npx expo export --platform android --source-maps --output-dir dist
      - name: Retain raw dependency audit status
        run: |
          MOBILE_AUDIT_EXIT=0
          npm audit --json > audit-report.json || MOBILE_AUDIT_EXIT=$?
          printf '%s\n' "$MOBILE_AUDIT_EXIT" > audit-exit-status.txt
      - name: Reject unreviewed findings or affected packages in Android runtime
        run: |
          MOBILE_MAP_PATH=$(find dist/_expo/static/js/android -name '*.map' -type f -print -quit)
          test -n "$MOBILE_MAP_PATH"
          node scripts/review-runtime-dependencies.mjs --audit audit-report.json --map "$MOBILE_MAP_PATH" > dependency-review.json
          cat dependency-review.json
      - name: Retain mobile audit and disposition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-dependency-evidence
          retention-days: 14
          path: |
            apps/mobile/audit-report.json
            apps/mobile/audit-exit-status.txt
            apps/mobile/dependency-review.json

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: npm run supabase:start

      - name: Apply provider-owned PostGIS containment on isolated local services
        run: node scripts/prepare-local-security.mjs

      - name: Reject unsafe public RLS, browser relation grants and definer RPCs
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql

      - name: Prove the security gate rejects reintroduced browser grants
        run: node scripts/verify-database-security-gate.mjs

      - name: Import and verify managed fixtures
        run: npm run supabase:local:configure

      - name: Install server-matched PostgreSQL host client for disposable GPS clone
        run: |
          set -euo pipefail
          . /etc/os-release
          test -n "${VERSION_CODENAME:-}"
          test "$(docker inspect --format '{{ index .Config.Labels "com.supabase.cli.project" }}' supabase_db_loadgistic-local)" = loadgistic-local
          local_pg_major="$(docker exec supabase_db_loadgistic-local psql -X -U postgres -d postgres -Atqc "select current_setting('server_version_num')::integer / 10000")"
          case "$local_pg_major" in 15|17) ;; *) exit 1 ;; esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$local_pg_major"
          test -x "/usr/lib/postgresql/$local_pg_major/bin/pg_dump"
          printf '/usr/lib/postgresql/%s/bin\n' "$local_pg_major" >> "$GITHUB_PATH"

      - name: Create disposable GPS test database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: node scripts/ci-disposable-gps-database.mjs create

      - name: Verify GPS privacy and credential races on disposable database
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 7m node scripts/verify-telematics-privacy-concurrency-local.mjs

      - name: Install isolated GPS demo fixtures
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-ci-isolated-setup.sql

      - name: Verify GPS demo location arbitration
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          { printf "set loadgistic.demo_isolated_test = 'true';\n"; cat tests/sql/demo-location-arbitration.sql; } | timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1

      - name: Verify ordered phone and GPS locks
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m node scripts/verify-driver-capacity-phone-lock-order-local.mjs ordered

      - name: Remove disposable GPS test database
        if: always()
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: node scripts/ci-disposable-gps-database.mjs remove

      - name: Verify exact Featured migration bootstrap with rolled-back fixtures
        run: node scripts/verify-featured-bootstrap-local.mjs

      - name: Verify the Data API guard through SQL, REST and GraphQL
        run: node scripts/verify-data-api-guard.mjs

      - name: Audit high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Verify Driver linkage and optional documents without retaining test writes
        run: docker exec -i supabase_db_loadgistic-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/capacity-driver-eligibility.sql

      - name: Verify plan-free access and automatic Featured with rollback
        run: docker exec -i supabase_db_loadgistic-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/platform-controls.sql

      - name: Verify audit authorization and privacy regressions with rollback
        run: |
          for suite in worldwide-capacity-loads capacity-sharing-policy tracking-owner-handover tracking-owner-retention tracking-device-location capacity-launch-matching \
            independent-single-truck provider-owner-fleets provider-vehicle-authority provider-live-publication-limit provider-publication-owner-scope provider-authority-recovery provider-authority-command-denials provider-authority-erasure provider-driving-intent provider-fleet-erasure provider-billing-retired capacity-search-metadata-cost capacity-multiple-options telematics telematics-account-privacy security-boundaries browser-boundaries account-details account-security capacity-viewport driver-portraits featured-random-rounds featured-continuous-rounds tracking-route-map \
            fleet-driver-onboarding driver-location-bootstrap driver-preverification dashboard-activity admin-service-geometry lifecycle-recovery public-provider-paging \
            public-provider-privacy support-attachments support-history support-polling chat-read-receipts driver-handover-alerts private-capacity-contact-names native-push-outbox tracking-proof-access tracking-email-session truck-document-alternatives capacity-ranked-search profile-search-page-cost public-provider-map-page-cost featured-operation-status featured-team-permission featured-broadcast-window provider-only-support freight-vehicle-catalogue \
            account-deletion public-content-safety content-policy-acceptance app-review-accounts play-scope-safeguards play-review-business-isolation public-capacity-policy-scope \
            truck-regular-service-scope personal-public-identity staff-active-permission-preservation review-moderation-restrictions support-waiting-claim-eligibility \
            platform-brokerage-retirement customer-business-workspaces business-capacity-sharing tracking-owner-delegation location-radius-choices tracking-selected-sources \
            phone-location-installations business-support-alerts business-native-push provider-public-account-identity business-directory-verification business-directory-retention capacity-published-location-source-filter driver-manual-capacity-location; do
            echo "::group::SQL regression: $suite"
            docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
            echo "::endgroup::"
          done

      - name: Verify retired Guest workload twice with rollback
        run: node scripts/verify-retired-guest-workload-local.mjs

      - name: Prove authority recovery cannot restore unsafe publication rules
        run: node scripts/verify-provider-authority-rollback-local.mjs

      - name: Verify provider truck publication and assignment races
        run: node scripts/verify-independent-truck-concurrency-local.mjs

      - name: Verify queued authorization and account closure races
        run: node scripts/verify-audit-concurrency.mjs

      - name: Validate specifications and source
        run: npm run check

      - name: Run domain and managed-contract tests
        run: npm test

      - name: Exercise the rolled-back 5,000-truck PostgreSQL scale fixture
        env:
          MARKET_SCALE_TRUCKS: 5000
        run: npm run test:scale

      - name: Type-check application
        run: npm run typecheck

      - name: Build production artifact
        run: npm run build

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-shards:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Every shard owns its database and retains one Playwright worker.
    timeout-minutes: 60
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: npm run supabase:start

      - name: Apply provider-owned PostGIS containment on isolated local services
        run: node scripts/prepare-local-security.mjs

      - name: Reject unsafe public RLS, browser relation grants and definer RPCs
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql

      - name: Import and verify managed fixtures
        run: npm run supabase:local:configure

      - name: Verify the Data API guard through SQL, REST and GraphQL
        run: node scripts/verify-data-api-guard.mjs

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Install locked Expo preview dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Start the isolated Loadgistic Expo preview for staff mobile-denial workflows
        working-directory: apps/mobile
        run: |
          mkdir -p ../../.local
          npm run preview:web > ../../.local/ci-mobile-preview.log 2>&1 &
          echo "$!" > ../../.local/ci-mobile-preview.pid

      - name: Run desktop and mobile browser workflows
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Stop the task-owned Expo preview
        if: always()
        run: |
          if test -f .local/ci-mobile-preview.pid; then
            kill "$(cat .local/ci-mobile-preview.pid)" 2>/dev/null || true
          fi

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    needs: e2e-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        run: test '${{ needs.e2e-shards.result }}' = 'success'

  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add non-secret build-context canaries
        run: |
          mkdir -p .local .netlify supabase/.temp supabase/.branches
          touch .local/context-canary .netlify/context-canary supabase/.temp/context-canary supabase/.branches/context-canary

      - name: Build standalone container
        run: docker build --tag loadgistic:${{ github.sha }} .
