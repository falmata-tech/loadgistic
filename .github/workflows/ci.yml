name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: npm run supabase:start

      - name: Import and verify managed fixtures
        run: npm run supabase:local:configure

      - name: Audit high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Validate specifications and source
        run: npm run check

      - name: Run domain and managed-contract tests
        run: npm test

      - name: Exercise the rolled-back 5,000-truck PostgreSQL scale fixture
        env:
          MARKET_SCALE_TRUCKS: 5000
        run: npm run test:scale

      - name: Type-check application
        run: npm run typecheck

      - name: Build production artifact
        run: npm run build

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start isolated Supabase
        run: npm run supabase:start

      - name: Import and verify managed fixtures
        run: npm run supabase:local:configure

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser workflows
        run: npm run test:e2e

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build standalone container
        run: docker build --tag loadgistic:${{ github.sha }} .
