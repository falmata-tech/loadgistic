name: Operations proof boundary

on:
  workflow_dispatch:
    inputs:
      case:
        description: Fixed synthetic workflow to diagnose
        type: choice
        default: operations-proof
        options: [operations-proof, admin-queues, simulator-db]
  push:
    branches: ['diagnose/admin-queues/**', 'diagnose/simulator-db/**']
  pull_request:
    paths:
      - '.github/workflows/operations-proof.yml'
      - 'scripts/ci-operations-proof.mjs'
      - 'scripts/ci-browser-shard.mjs'
      - 'tests/e2e/operations-connected-actions.spec.ts'
      - 'src/components/tracking-proof-link.tsx'

permissions:
  contents: read

concurrency:
  group: operations-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: ${{ inputs.case != 'simulator-db' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/diagnose/simulator-db/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - uses: actions/checkout@v6

      - name: Reserve fixed local service ports on this disposable runner
        env:
          LOADGISTIC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node scripts/ci-reserve-local-ports.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install checksum-pinned workflow linter
        run: npm run tools:workflow:setup
      - name: Check diagnostic source and contracts
        run: npm run check
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
      - name: Start isolated Supabase
        run: node scripts/ci-start-local-supabase.mjs
      - name: Apply local PostGIS containment
        run: node scripts/prepare-local-security.mjs
      - name: Check database security
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql
      - name: Prepare and verify local synthetic fixtures
        run: npm run supabase:local:configure
      - name: Verify independent Data API denial
        run: node scripts/verify-data-api-guard.mjs
      - run: npx playwright install --with-deps chromium
      - name: Repeat the exact proof task on desktop and phone without retries
        env:
          FOCUS_CASE: ${{ inputs.case || (github.event_name == 'push' && 'admin-queues') || 'operations-proof' }}
        run: node scripts/ci-operations-proof.mjs --case "$FOCUS_CASE"
      - name: Retain only typed browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: focused-browser-failure
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: .local/ci-browser-diagnostics/*.json
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  simulator-db:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.case == 'simulator-db') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/diagnose/simulator-db/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      TRACKING_CODE_SECRET: ci-only-tracking-code-secret-not-for-production-123456
    steps:
      - uses: actions/checkout@v6
      - name: Reserve fixed local service ports on this disposable runner
        env:
          LOADGISTIC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node scripts/ci-reserve-local-ports.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install checksum-pinned workflow linter
        run: npm run tools:workflow:setup
      - name: Check diagnostic source and contracts before Docker
        run: npm run check
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
      - name: Start isolated Supabase and apply repository migrations
        run: timeout --signal=TERM --kill-after=10s 15m node scripts/ci-start-local-supabase.mjs
      - name: Apply local PostGIS containment
        run: node scripts/prepare-local-security.mjs
      - name: Check database security
        run: docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/check-database-security.sql
      - name: Prove the security gate rejects reintroduced browser grants
        run: node scripts/verify-database-security-gate.mjs
      - name: Require migrations 221 through 225 and inert simulator controls
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{ index .Config.Labels "com.supabase.cli.project" }}' supabase_db_loadgistic-local)" = loadgistic-local
          timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $check$
          begin
            if current_database()<>'postgres' or
              (select array_agg(version::text order by version) from supabase_migrations.schema_migrations
                where version in ('221','222','223','224','225'))
                is distinct from array['221','222','223','224','225']::text[] then
              raise exception 'SIMULATOR_DIAGNOSTIC_MIGRATIONS_REQUIRED';
            end if;
            if not exists(select 1 from public.demo_world_control where id=1 and not enabled
                and activated_at is null and last_dispatch_at is null and catalog_version=2)
              or (select count(*) from public.demo_world_targets)<>5
              or (select count(*) from public.demo_world_schedule)<>20
              or exists(select 1 from public.demo_world_steps)
              or exists(select 1 from public.demo_world_receipts)
              or not exists(select 1 from public.demo_hosted_motion_control where id=1 and not enabled and kill_switch)
              or not exists(select 1 from public.demo_world_profile_control where id=1 and not enabled)
              or not exists(select 1 from public.demo_world_business_share_control where id=1 and not enabled)
              or not exists(select 1 from public.demo_world_team_control where id=1 and not enabled)
              or not exists(select 1 from public.demo_world_duty_control where id=1 and not enabled)
              or not exists(select 1 from public.demo_world_tracking_lifecycle_control where id=1 and not armed)
              or not exists(select 1 from public.demo_world_tracking_live_control where id=1 and not armed) then
              raise exception 'SIMULATOR_DIAGNOSTIC_INERT_BASELINE_REQUIRED';
            end if;
          end $check$;
          SQL
      - name: Prepare and verify local synthetic fixtures
        run: npm run supabase:local:configure
      - name: Verify independent Data API denial
        run: node scripts/verify-data-api-guard.mjs
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Check the strict browser fixture contract once
        run: timeout --signal=TERM --kill-after=10s 5m node scripts/ci-fixture-preflight.mjs
      - name: Verify Phone and GPS only location writes with rollback
        run: |
          set -euo pipefail
          for suite in driver-manual-capacity-location location-radius-choices telematics telematics-account-privacy tracking-owner-delegation tracking-selected-sources; do
            echo "::group::SQL regression: $suite"
            timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
            echo "::endgroup::"
          done
      - name: Install server-matched PostgreSQL host client for disposable GPS clone
        run: |
          set -euo pipefail
          . /etc/os-release
          test -n "${VERSION_CODENAME:-}"
          test "$(docker inspect --format '{{ index .Config.Labels "com.supabase.cli.project" }}' supabase_db_loadgistic-local)" = loadgistic-local
          local_pg_major="$(docker exec supabase_db_loadgistic-local psql -X -U postgres -d postgres -Atqc "select current_setting('server_version_num')::integer / 10000")"
          case "$local_pg_major" in 15|17) ;; *) exit 1 ;; esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$local_pg_major"
          test -x "/usr/lib/postgresql/$local_pg_major/bin/pg_dump"
          printf '/usr/lib/postgresql/%s/bin\n' "$local_pg_major" >> "$GITHUB_PATH"
      - name: Create disposable GPS test database
        id: simulator_clone
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 10m node scripts/ci-disposable-gps-database.mjs create
      - name: Verify durable Capacity, catalog, paused Manual lanes and owner isolation
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: |
          set -euo pipefail
          test "$LOADGISTIC_TEST_DATABASE" = loadgistic_telematics_ci
          for suite in demo-world-durable-capacity demo-world-fast-catalog demo-world-tracking-notification-sink demo-world-duty-cycle demo-world-atomic-handover demo-world-handover-worker demo-world-provider-profile demo-world-tracking-lifecycle-readiness demo-world-tracking-lifecycle-reservation demo-tracking-exact-incomplete-resume demo-world-tracking-live-reservation; do
            echo "::group::SQL regression: $suite"
            timeout --signal=TERM --kill-after=10s 3m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < "tests/sql/$suite.sql"
            echo "::endgroup::"
          done
      - name: Install isolated GPS demo fixtures after Capacity regressions
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 2m docker exec -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-ci-isolated-setup.sql
      - name: Reject simulator enrollment and writes for normal signup accounts
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m docker exec -e PGOPTIONS='-c loadgistic.demo_isolated_test=true' -i supabase_db_loadgistic-local psql -X -U postgres -d "$LOADGISTIC_TEST_DATABASE" -v ON_ERROR_STOP=1 < tests/sql/demo-account-isolation.sql
      - name: Remove disposable GPS test database
        if: ${{ always() && contains(fromJSON('["success","failure","cancelled"]'), steps.simulator_clone.outcome) }}
        env:
          LOADGISTIC_TEST_DATABASE: loadgistic_telematics_ci
        run: timeout --signal=TERM --kill-after=10s 3m node scripts/ci-disposable-gps-database.mjs remove
      - name: Stop isolated Supabase
        if: always()
        run: timeout --signal=TERM --kill-after=10s 3m supabase stop --no-backup
