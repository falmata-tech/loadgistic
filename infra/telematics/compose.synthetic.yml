name: loadgistic-telematics-synthetic

# Fictional-only project. No service joins or depends on the physical gateway.
# A protected independent env file contains only this gateway's existing secrets.
services:
  synthetic-database:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${SYNTHETIC_DATABASE_PASSWORD:?Set a distinct protected synthetic database password}
    volumes:
      - synthetic-database:/var/lib/postgresql/data
    networks: [synthetic-backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U traccar -d traccar']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  synthetic-traccar:
    image: traccar/traccar:6.16.0-alpine
    depends_on:
      synthetic-database: {condition: service_healthy}
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: 'true'
      DATABASE_PASSWORD: ${SYNTHETIC_DATABASE_PASSWORD:?Set a distinct protected synthetic database password}
    volumes:
      - ./traccar-synthetic.xml:/opt/traccar/conf/traccar.xml:ro
    # Deliberately no host ports: neither GT06 nor admin/API is Internet-facing.
    networks: [synthetic-backend]
    healthcheck:
      test: [CMD, wget, -q, -T, '5', -O, /dev/null, 'http://127.0.0.1:8082/api/server']
      interval: 15s
      timeout: 6s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  synthetic-bridge:
    build: .
    depends_on:
      synthetic-database: {condition: service_healthy}
      synthetic-traccar: {condition: service_healthy}
    environment:
      GATEWAY_DATABASE_URL: postgres://loadgistic_bridge:${SYNTHETIC_BRIDGE_PASSWORD:?Set a distinct synthetic bridge database password}@synthetic-database:5432/traccar
      GATEWAY_ID: ${SYNTHETIC_GATEWAY_ID:?Set the reviewed synthetic-only gateway ID}
      GATEWAY_SECRET: ${SYNTHETIC_GATEWAY_SECRET:?Set a distinct protected synthetic gateway HMAC secret}
      GATEWAY_COMMANDS_ENABLED: 'false'
      LOADGISTIC_GATEWAY_URL: ${LOADGISTIC_GATEWAY_URL:?Set the exact HTTPS Loadgistic gateway URL}
      TRACCAR_READINESS_URL: http://synthetic-traccar:8082/api/server
    networks: [synthetic-backend, synthetic-egress]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: ['/tmp/loadgistic-bridge:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700']
    healthcheck:
      test: [CMD, node, gateway-health.mjs, --check]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  synthetic-motion-worker:
    # The profile and two independent flags keep motion inert by default.
    profiles: [hosted-demo-motion]
    build:
      context: ../..
      dockerfile: infra/telematics/Dockerfile.motion
    depends_on:
      synthetic-traccar: {condition: service_healthy}
    environment:
      NODE_ENV: production
      LOADGISTIC_HOSTED_MOTION_WORKER_ENABLED: ${LOADGISTIC_HOSTED_MOTION_WORKER_ENABLED:-false}
      LOADGISTIC_HOSTED_MOTION_WORKER_KILL_SWITCH: ${LOADGISTIC_HOSTED_MOTION_WORKER_KILL_SWITCH:-true}
      LOADGISTIC_HOSTED_MOTION_SITE_ORIGIN: ${LOADGISTIC_HOSTED_MOTION_SITE_ORIGIN:-}
      LOADGISTIC_HOSTED_MOTION_SITE_ID: ${LOADGISTIC_HOSTED_MOTION_SITE_ID:-}
      LOADGISTIC_HOSTED_MOTION_SUPABASE_URL: ${LOADGISTIC_HOSTED_MOTION_SUPABASE_URL:-}
      HOSTED_DEMO_MOTION_SECRET: ${HOSTED_DEMO_MOTION_SECRET:-}
      SYNTHETIC_GT06_HOST: synthetic-traccar
      SYNTHETIC_GT06_PORT: '5023'
    networks: [synthetic-backend, synthetic-egress]
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  synthetic-enrollment-relay:
    profiles: [enrollment-relay]
    build:
      context: ../..
      dockerfile: infra/telematics/Dockerfile.relay
    depends_on:
      synthetic-traccar: {condition: service_healthy}
    environment:
      ENROLLMENT_RELAY_SCOPE: synthetic
      ENROLLMENT_RELAY_TOKEN_FILE: /run/secrets/relay-token
      ENROLLMENT_RELAY_UPSTREAM_TOKEN_FILE: /run/secrets/traccar-token
    volumes:
      - type: bind
        source: ${SYNTHETIC_RELAY_TOKEN_FILE:-/not-configured/synthetic-relay-token}
        target: /run/secrets/relay-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SYNTHETIC_RELAY_UPSTREAM_TOKEN_FILE:-/not-configured/synthetic-traccar-token}
        target: /run/secrets/traccar-token
        read_only: true
        bind: {create_host_path: false}
    # Host TLS proxy only; the synthetic Traccar and GT06 interfaces stay private.
    ports: ['127.0.0.1:28083:8080/tcp']
    networks: [synthetic-backend]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

networks:
  synthetic-backend:
    internal: true
  synthetic-egress: {}

volumes:
  synthetic-database:
