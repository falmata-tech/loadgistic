name: loadgistic-telematics-hosted

# Physical receive-only deployment template. Fictional services are independently
# deployed with compose.synthetic.yml, never as dependencies of this project.
# No listener is published until an approved bind address and firewall exist.
services:
  database:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${GATEWAY_DATABASE_PASSWORD:?Set a unique protected database password}
    volumes:
      - gateway-database:/var/lib/postgresql/data
    networks: [gateway-backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U traccar -d traccar']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  traccar:
    image: traccar/traccar:6.16.0-alpine
    depends_on:
      database: {condition: service_healthy}
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: 'true'
      DATABASE_PASSWORD: ${GATEWAY_DATABASE_PASSWORD:?Set a unique protected database password}
    volumes:
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
    ports:
      # Qualify GT06 and the physical model before adding another protocol.
      - '${GPS_INGRESS_BIND_ADDRESS:?Set the approved device-facing interface}:15023:5023/tcp'
      # Operator access stays on host loopback; administer remotely over SSH/VPN.
      - '127.0.0.1:18082:8082/tcp'
    networks: [gateway-backend]
    healthcheck:
      test: [CMD, wget, -q, -T, '5', -O, /dev/null, 'http://127.0.0.1:8082/api/server']
      interval: 15s
      timeout: 6s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  bridge:
    build: .
    depends_on:
      database: {condition: service_healthy}
      traccar: {condition: service_healthy}
    environment:
      GATEWAY_DATABASE_URL: postgres://loadgistic_bridge:${GATEWAY_BRIDGE_PASSWORD:?Set a unique bridge database password}@database:5432/traccar
      GATEWAY_ID: ${GATEWAY_ID:?Set the reviewed gateway ID}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set the separate protected gateway HMAC secret}
      # Commands remain disabled on real hardware until a separate safety release.
      GATEWAY_COMMANDS_ENABLED: 'false'
      LOADGISTIC_GATEWAY_URL: ${LOADGISTIC_GATEWAY_URL:?Set the exact HTTPS Loadgistic gateway URL}
      TRACCAR_READINESS_URL: http://traccar:8082/api/server
    networks: [gateway-backend, gateway-egress]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: ['/tmp/loadgistic-bridge:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700']
    healthcheck:
      test: [CMD, node, gateway-health.mjs, --check]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

  enrollment-relay:
    profiles: [enrollment-relay]
    build:
      context: ../..
      dockerfile: infra/telematics/Dockerfile.relay
    depends_on:
      traccar: {condition: service_healthy}
    environment:
      ENROLLMENT_RELAY_SCOPE: real
      ENROLLMENT_RELAY_TOKEN_FILE: /run/secrets/relay-token
      ENROLLMENT_RELAY_UPSTREAM_TOKEN_FILE: /run/secrets/traccar-token
    volumes:
      - type: bind
        source: ${GATEWAY_RELAY_TOKEN_FILE:-/not-configured/relay-token}
        target: /run/secrets/relay-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GATEWAY_RELAY_UPSTREAM_TOKEN_FILE:-/not-configured/traccar-token}
        target: /run/secrets/traccar-token
        read_only: true
        bind: {create_host_path: false}
    ports: ['127.0.0.1:18083:8080/tcp']
    networks: [gateway-backend]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: 10m, max-file: '2'}}

networks:
  gateway-backend:
    internal: true
  gateway-egress: {}

volumes:
  gateway-database:
