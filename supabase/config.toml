project_id = "loadgistic-local"

[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/**", "http://localhost:3100/**", "http://127.0.0.1:3001/**", "http://localhost:3001/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Loadgistic sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your Loadgistic signup code"
content_path = "./supabase/templates/signup-code.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "4MiB"
