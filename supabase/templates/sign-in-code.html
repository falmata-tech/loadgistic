<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f5f7;color:#0b1d3a;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:32px auto;padding:28px;background:#fff;border:1px solid #d7dfeb;border-radius:14px">
      <img src="https://loadgistic.com/brand/loadgistic-wordmark-on-white.png" alt="Loadgistic" width="174" height="45" style="display:block;max-width:100%;height:auto;margin:0 0 20px" />
      <h1 style="margin:0 0 12px;font-size:24px">Your sign-in code</h1>
      <p style="margin:0 0 20px;color:#526375;line-height:1.5">Enter this code on the Loadgistic login screen. It expires in 10 minutes.</p>
      <p style="margin:0;padding:16px;border-radius:10px;background:#eaf1ff;font-size:30px;font-weight:800;letter-spacing:.16em;text-align:center">{{ .Token }}</p>
      <p style="margin:20px 0 0;color:#526375;font-size:13px;line-height:1.5">If you did not request this code, you can ignore this email. Loadgistic will never ask you to share this code.</p>
    </div>
  </body>
</html>
