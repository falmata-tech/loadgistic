<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f5f7;color:#0b1d3a;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:32px auto;padding:28px;background:#fff;border:1px solid #d7e2e0;border-radius:14px">
      <p style="margin:0 0 8px;color:#0d6b6e;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Loadgistic</p>
      <h1 style="margin:0 0 12px;font-size:24px">Confirm your transporter email</h1>
      <p style="margin:0 0 20px;color:#52656d;line-height:1.5">Enter this code on Loadgistic to continue creating your transporter account. It expires in 10 minutes.</p>
      <p style="margin:0;padding:16px;border-radius:10px;background:#eef7f5;font-size:30px;font-weight:800;letter-spacing:.16em;text-align:center">{{ .Token }}</p>
      <p style="margin:20px 0 0;color:#687981;font-size:13px;line-height:1.5">If you did not request this code, you can ignore this email. Loadgistic will never ask you to share this code.</p>
    </div>
  </body>
</html>
