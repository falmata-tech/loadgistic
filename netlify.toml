[build]
command = "node scripts/check-netlify-scan-exceptions.mjs && npm run build"

[build.environment]
NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"
# Each exception is byte/value-locked by the command above. Scanners stay on.
SECRETS_SCAN_OMIT_KEYS = "LOADGISTIC_SMTP_USER,LOADGISTIC_EMAIL_REPLY_TO"
SECRETS_SCAN_OMIT_PATHS = "apps/mobile/google-services.json"

# Netlify detects Next.js and provisions its maintained OpenNext adapter.
# Do not pin @netlify/plugin-nextjs: automatic adapter updates preserve support
# for the security-patched Next.js release in package-lock.json.
